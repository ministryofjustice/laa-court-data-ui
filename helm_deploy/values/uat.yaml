namespace: laa-court-data-ui-uat
replicas:
  worker: 2
  web: 4
image:
  tag: ""
  repository: "nginx"
resources:
  limits:
    cpu: 1
    memory: 1000Mi
  requests:
    cpu: 100m
    memory: 500Mi
env: uat
host: uat.view-court-data.service.justice.gov.uk
cdaHost: https://laa-court-data-adaptor-uat.apps.live.cloud-platform.service.justice.gov.uk/api/internal/v1
googleAnalyticsId: 'UA-131160087-17'
displayRawResponses: enabled
identifier: laa-court-data-ui-app-ingress-laa-court-data-ui-uat-green
cert: laa-court-data-ui-uat-cert
omniauthRedirectUri: https://uat.view-court-data.service.justice.gov.uk/users/auth/entra/callback
featureFlags:
  perUserFeatureFlags: true
  maintenanceMode: false
  noLinking: false
  timeBasedAccessRestriction: true
  showStats: true
  showLinkMigratedCases: true
  fakeAuth: false
